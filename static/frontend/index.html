<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy AI Support</title>
    <link rel="stylesheet" href="/static/frontend/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>ShopEasy AI Support</h2>
            <span class="status">Online | Replies instantly</span>
        </div>
        
        <div class="chat-body" id="chat-box">
            <div class="message bot-message">
                Hello! I'm your AI support assistant. How can I help you today?<br>
                You can ask about delivery, returns, or track your order.
            </div>
        </div>
        
        <div class="chat-footer">
            <!-- কুইক বাটনগুলো উপরে -->
            <div class="quick-actions">
                <button onclick="sendQuick('What is the delivery charge?')">💰 Delivery Charge</button>
                <button onclick="sendQuick('What is your return policy?')">↩️ Return Policy</button>
                <button onclick="sendQuick('Track my order')">🚚 Track Order</button>
                <button onclick="sendQuick('Recommend a product')">⭐ Recommend Product</button>
                <button onclick="sendQuick('I need human support')">🎧 Human Support</button>
            </div>
            
            <!-- ইনপুট বক্স সবার নিচে -->
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script src="/static/frontend/script.js"></script>
</body>
</html>
